<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocorrências — RMPF</title>
  <link rel="stylesheet" href="css/rmpf.css">
  <link rel="icon" type="image/x-icon"     href="icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" type="image/svg+xml"    href="icons/favicon.svg">
  <link rel="apple-touch-icon"             href="icons/apple-touch-icon.png">
  <link rel="manifest"                     href="manifest.webmanifest">
  <meta name="theme-color" content="#1565c0">
</head>
<body>
<div id="loading-overlay" class="loading-overlay">
  <div class="spinner spinner-lg"></div>
  <div class="loading-text">Carregando…</div>
</div>

<div class="app-layout" id="app" style="display:none">
  <header class="app-header nao-imprimir">
    <button class="hamburger" id="hamburger">☰</button>
    <div><div class="logo-text">🏛️ RMPF</div><div class="logo-sub">Produtividade Fiscal</div></div>
    <div class="header-right">
      <span class="user-name" id="header-nome">—</span>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </header>
  <nav class="app-sidebar nao-imprimir" id="sidebar"></nav>

  <main class="app-main">
    <div class="page-title">📌 Ocorrências</div>
    <div id="alert-area"></div>

    <!-- Fiscal: form to register -->
    <div id="form-wrap" style="display:none">
      <div class="card" style="max-width:560px">
        <div class="card-title">Registrar Ocorrência</div>
        <form id="form-ocorrencia" novalidate>
          <div class="form-row cols-2">
            <div class="form-group">
              <label class="form-label required" for="o-mes">Mês</label>
              <select class="form-control" id="o-mes" required></select>
            </div>
            <div class="form-group">
              <label class="form-label required" for="o-ano">Ano</label>
              <select class="form-control" id="o-ano" required></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label required" for="o-tipo">Tipo de Ocorrência</label>
            <select class="form-control" id="o-tipo" required>
              <option value="">— selecione —</option>
              <!-- "Férias" (Art. 11, I) saiu do lançamento manual: agora é
                   sincronizado automaticamente da escala de férias do VISA. -->
              <option value="licenca_medica">Licença Médica</option>
              <option value="licenca_gestante">Licença Gestante</option>
              <option value="cargo_comissao">Cargo em Comissão</option>
              <option value="afastamento_legal">Outros afastamentos funcionais imperativos</option>
            </select>
          </div>
          <div class="form-row cols-2">
            <div class="form-group">
              <label class="form-label required" for="o-inicio">Data Início</label>
              <input type="date" class="form-control" id="o-inicio" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="o-fim">Data Fim</label>
              <input type="date" class="form-control" id="o-fim">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="o-desc">Descrição / Detalhes</label>
            <textarea class="form-control" id="o-desc" rows="2" placeholder="Informações adicionais…"></textarea>
          </div>
          <div id="form-alert"></div>
          <button type="button" class="btn btn-primary" id="btn-registrar">📌 Registrar Ocorrência</button>
        </form>
      </div>
    </div>

    <!-- List -->
    <div class="comp-selector">
      <label>Competência:</label>
      <select class="form-control" id="sel-mes" style="max-width:140px"></select>
      <select class="form-control" id="sel-ano" style="max-width:90px"></select>
      <select class="form-control" id="sel-fiscal" style="max-width:200px;display:none">
        <option value="">— todos fiscais —</option>
      </select>
      <button class="btn btn-outline btn-sm" id="btn-carregar">Carregar</button>
    </div>

    <div class="card">
      <div class="card-title">📋 Ocorrências Registradas</div>
      <div class="table-wrap">
        <table class="rmpf-table">
          <thead>
            <tr id="ocorr-head">
              <th id="th-fiscal-col" class="sortable" data-sort="fiscal" style="display:none">Fiscal<span class="sort-ind"></span></th>
              <th class="sortable" data-sort="tipo">Tipo<span class="sort-ind"></span></th>
              <th class="sortable" data-sort="periodo">Período<span class="sort-ind"></span></th>
              <th class="sortable" data-sort="descricao">Descrição<span class="sort-ind"></span></th>
              <th class="sortable" data-sort="status">Status<span class="sort-ind"></span></th>
              <th class="nao-imprimir" id="th-acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-ocorrencias">
            <tr class="empty-row"><td colspan="6">Selecione uma competência e clique em Carregar</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Detalhe modal (Administrador) -->
    <div id="modal-rev" class="modal-backdrop" style="display:none">
      <div class="modal">
        <div class="modal-header">
          <span>Revisar Ocorrência</span>
          <button class="modal-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="rev-id">
          <div class="form-group">
            <label class="form-label">Fiscal</label>
            <input class="form-control" id="rev-fiscal" disabled>
          </div>
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <input class="form-control" id="rev-tipo" disabled>
          </div>
          <div class="form-group">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" id="rev-desc" rows="2" disabled></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="rev-obs">Observação do Administrador</label>
            <textarea class="form-control" id="rev-obs" rows="2"></textarea>
          </div>
          <div id="rev-alert"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default" id="modal-close2">Cancelar</button>
          <button class="btn btn-danger" id="btn-rej">✗ Rejeitar</button>
          <button class="btn btn-primary" id="btn-aceit">✓ Aceitar</button>
        </div>
      </div>
    </div>
  </main>
  <footer class="app-footer nao-imprimir">
    RMPF v<span id="footer-version"></span> — <a href="changelog.html">Changelog</a>
  </footer>
</div>

<!-- Modal: Dispositivo Legal da Ocorrência -->
<div id="modal-dispositivo-ocr" class="modal-backdrop" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <span>Dispositivo Legal</span>
      <button class="modal-close" id="disp-ocr-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Embasamento Legal</label>
        <input class="form-control" id="disp-ocr-texto" disabled style="font-size:0.95em">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" id="disp-ocr-close2">Fechar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/version.js"></script>
<script src="js/utils.js"></script>
<script src="js/calculo.js"></script>
<script src="js/firestore.js"></script>
<script src="js/guard.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ferias-auto-sync.js"></script>
<script>
  let _user  = null;
  let _perfil = '';
  let _ocorrs = [];
  let _sort  = { key: 'periodo', dir: 1 };

  const TIPO_LABELS = {
    ferias: 'Férias',
    licenca_medica: 'Licença Médica',
    licenca_gestante: 'Licença Gestante',
    cargo_comissao: 'Cargo em Comissão',
    afastamento_legal: 'Outros afastamentos funcionais imperativos',
    outros: 'Outros afastamentos funcionais imperativos',
  };

  function buildSidebar(perfil) {
    const links = perfil === 'Fiscal' ? [
      ['dashboard.html','📊','Dashboard'],
      ['lancamento.html','✏️','Lançar Atividade'],
      ['meus-lancamentos.html','📋','Meus Lançamentos'],
      ['ocorrencias.html','📌','Ocorrências'],
    ] : [
      ['dashboard.html','📊','Dashboard'],
      ['conferencia.html','🔍','Conferência'],
      ['ocorrencias.html','📌','Ocorrências'],
      ['fechamento.html','🔒','Fechamento'],
    ];
    const cur = location.pathname.split('/').pop();
    const base = links.map(([href,icon,label]) =>
      `<a href="${href}" class="sidebar-link${cur===href?' active':''}"><span class="icon">${icon}</span>${label}</a>`
    ).join('');
    const admin = perfil === 'Administrador'
      ? `<a href="admin.html" class="sidebar-link${cur==='admin.html'?' active':''}"><span class="icon">⚙️</span>Admin</a>`
        + `<a href="parametrizacao.html" class="sidebar-link${cur==='parametrizacao.html'?' active':''}"><span class="icon">🔧</span>Parametrização</a>`
      : '';
    const changelog = `<a href="changelog.html" class="sidebar-link${cur==='changelog.html'?' active':''}"><span class="icon">📜</span>Changelog</a>`;
    return base + admin + changelog;
  }

  function buildSels(mesId, anoId) {
    const selM = document.getElementById(mesId);
    MESES.forEach((m,i)=>{
      const o=document.createElement('option');o.value=i+1;o.textContent=m;
      if(i===new Date().getMonth())o.selected=true;selM.appendChild(o);
    });
    const selA = document.getElementById(anoId);
    const y = new Date().getFullYear();
    for(let i=y-1;i<=y+1;i++){
      const o=document.createElement('option');o.value=i;o.textContent=i;
      if(i===y)o.selected=true;selA.appendChild(o);
    }
  }

  // diasDaOcorrenciaPorMes / periodosSeSobrepoem (js/utils.js) e
  // ocorrenciaConflitante (js/firestore.js) agora são compartilhados — a mesma
  // lógica é reutilizada pela sincronização automática de férias.

  async function registrarOcorrencia() {
    const tipo  = document.getElementById('o-tipo').value;
    const inicio= document.getElementById('o-inicio').value;
    const fim   = document.getElementById('o-fim').value;
    const desc  = document.getElementById('o-desc').value.trim();
    const mes   = Number(document.getElementById('o-mes').value);
    const ano   = Number(document.getElementById('o-ano').value);
    const formAlert = document.getElementById('form-alert');
    const btn = document.getElementById('btn-registrar');
    if (!tipo||!inicio) {
      formAlert.innerHTML = alerta('warn','Preencha tipo e data de início.');
      return;
    }
    if (fim && fim < inicio) {
      formAlert.innerHTML = alerta('warn','A data fim não pode ser anterior à data início.');
      return;
    }
    btn.disabled = true;
    try {
      // ── Bloqueia ocorrências sobrepostas para a(s) mesma(s) data(s) ──
      formAlert.innerHTML = alerta('info','🔄 Verificando ocorrências já registradas…');
      const conflito = await ocorrenciaConflitante(_user.email, inicio, fim, null);
      if (conflito) {
        const per = conflito.data_fim
          ? `${fmtData(conflito.data_inicio)} — ${fmtData(conflito.data_fim)}`
          : fmtData(conflito.data_inicio);
        formAlert.innerHTML = alerta('danger',
          `Já existe uma ocorrência registrada que se sobrepõe a este período ` +
          `(<strong>${TIPO_LABELS[conflito.tipo]||escHtml(conflito.tipo)}</strong>, ${per} — ` +
          `${badge(conflito.status)}). Não é permitido registrar duas ocorrências para a(s) mesma(s) data(s).`);
        return;
      }

      await db_createOcorrencia({
        fiscal_email: _user.email,
        fiscal_nome:  _user.nome || _user.email,
        mes, ano,
        tipo, data_inicio: inicio, data_fim: fim||null,
        descricao: desc||null, status: 'pendente',
        dispositivo_legal: window.dispositivoLegalOcorrencia
          ? window.dispositivoLegalOcorrencia(tipo)
          : 'Art. 11 da Lei Complementar nº 548/2023',
      });
      document.getElementById('alert-area').innerHTML = alerta('ok','Ocorrência registrada com sucesso.');
      document.getElementById('form-ocorrencia').reset();
      formAlert.innerHTML = '';
      loadOcorrencias();
    } catch(e) {
      formAlert.innerHTML = alerta('danger','Erro: '+escHtml(e.message));
    } finally {
      btn.disabled = false;
    }
  }

  async function loadOcorrencias() {
    const mes = Number(document.getElementById('sel-mes').value);
    const ano = Number(document.getElementById('sel-ano').value);
    const tbody = document.getElementById('tbody-ocorrencias');
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6"><div class="spinner"></div></td></tr>';

    try {
      if (_perfil === 'Fiscal') {
        _ocorrs = await db_getOcorrencias(_user.email, mes, ano);
      } else {
        const fiscalFilter = document.getElementById('sel-fiscal').value;
        _ocorrs = await db_getOcorrenciasTodas(mes, ano);
        if (fiscalFilter) _ocorrs = _ocorrs.filter(o => o.fiscal_email === fiscalFilter);
      }
      renderOcorrs();
    } catch(e) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="6">${alerta('danger','Erro: '+escHtml(e.message))}</td></tr>`;
    }
  }

  function sortVal(o, key) {
    switch (key) {
      case 'fiscal':    return (o.fiscal_nome || o.fiscal_email || '').toLowerCase();
      case 'tipo':      return (TIPO_LABELS[o.tipo] || o.tipo || '').toLowerCase();
      case 'periodo':   return o.data_inicio || '';
      case 'descricao': return (o.descricao || '').toLowerCase();
      case 'status':    return o.status || '';
      default:          return '';
    }
  }

  function updateSortIndicators() {
    document.querySelectorAll('#ocorr-head th.sortable').forEach(th => {
      const ind = th.querySelector('.sort-ind');
      if (!ind) return;
      ind.textContent = th.dataset.sort === _sort.key ? (_sort.dir === 1 ? ' ▲' : ' ▼') : '';
    });
  }

  function attachSortHandlers() {
    document.querySelectorAll('#ocorr-head th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (_sort.key === key) _sort.dir *= -1;
        else { _sort.key = key; _sort.dir = 1; }
        renderOcorrs();
      });
    });
  }

  function renderOcorrs() {
    const tbody = document.getElementById('tbody-ocorrencias');
    const isAdmin = _perfil === 'Administrador';
    updateSortIndicators();
    if (!_ocorrs.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Nenhuma ocorrência nesta competência</td></tr>';
      return;
    }
    const rows = _ocorrs.slice();
    if (_sort.key) {
      rows.sort((a, b) => {
        const va = sortVal(a, _sort.key), vb = sortVal(b, _sort.key);
        if (va < vb) return -1 * _sort.dir;
        if (va > vb) return  1 * _sort.dir;
        return 0;
      });
    }
    tbody.innerHTML = rows.map(o => {
      const periodo = o.data_fim ? `${fmtData(o.data_inicio)} — ${fmtData(o.data_fim)}` : fmtData(o.data_inicio);
      let acoes = '—';
      if (isAdmin && o.status === 'pendente') {
        acoes = `<button class="btn btn-outline btn-sm" onclick="abrirRev('${o.id}')">📝 Revisar</button>`;
      } else if (isAdmin) {
        acoes = `<button class="btn btn-default btn-sm" onclick="abrirRev('${o.id}')">✏️ Rever</button>`;
      } else if (!isAdmin && (o.status === 'pendente' || o.status === 'recusado')) {
        // Fiscal pode excluir a própria ocorrência enquanto ela ainda não foi
        // aceita (pendente) ou após ter sido recusada.
        acoes = `<button class="btn btn-danger btn-sm" onclick="excluirOcorrencia('${o.id}')">🗑️ Excluir</button>`;
      }
      const fiscalCol = (_perfil !== 'Fiscal') ? `<td data-label="Fiscal">${escHtml(o.fiscal_nome||o.fiscal_email)}</td>` : '';
      return `<tr>
        ${fiscalCol}
        <td data-label="Tipo">${TIPO_LABELS[o.tipo]||escHtml(o.tipo)}</td>
        <td data-label="Período">${periodo}</td>
        <td data-label="Descrição">${escHtml(o.descricao||'—')}</td>
        <td data-label="Status">${badge(o.status)}${o.dispositivo_legal ? ` <a href="#" onclick="abrirDispositivoOcr('${escHtml(o.id)}');return false" title="Ver dispositivo legal">⚖️</a>` : ''}</td>
        <td data-label="Ações" class="nao-imprimir">${acoes}</td>
      </tr>`;
    }).join('');
  }

  async function excluirOcorrencia(id) {
    const o = _ocorrs.find(x => x.id === id);
    if (!o) return;
    // Trava de segurança: ocorrências aceitas geram lançamentos e não podem
    // ser excluídas pelo fiscal por aqui.
    if (o.status === 'aceito') {
      document.getElementById('alert-area').innerHTML =
        alerta('warn', 'Ocorrências já aceitas não podem ser excluídas. Solicite ao administrador.');
      return;
    }
    const per = o.data_fim
      ? `${fmtData(o.data_inicio)} — ${fmtData(o.data_fim)}`
      : fmtData(o.data_inicio);
    if (!confirm(`Excluir a ocorrência "${TIPO_LABELS[o.tipo] || o.tipo}" (${per})?`)) return;
    try {
      await db_deleteOcorrencia(id);
      _ocorrs = _ocorrs.filter(x => x.id !== id);
      renderOcorrs();
      document.getElementById('alert-area').innerHTML = alerta('ok', 'Ocorrência excluída.');
    } catch(e) {
      document.getElementById('alert-area').innerHTML = alerta('danger', 'Erro ao excluir: ' + escHtml(e.message));
    }
  }
  window.excluirOcorrencia = excluirOcorrencia;

  function abrirRev(id) {
    const o = _ocorrs.find(x => x.id === id);
    if (!o) return;
    document.getElementById('rev-id').value     = id;
    document.getElementById('rev-fiscal').value = o.fiscal_nome||o.fiscal_email;
    document.getElementById('rev-tipo').value   = TIPO_LABELS[o.tipo]||o.tipo;
    document.getElementById('rev-desc').value   = o.descricao||'';
    document.getElementById('rev-obs').value    = o.obs_admin||'';
    document.getElementById('rev-alert').innerHTML = '';
    document.getElementById('modal-rev').style.display = 'flex';
  }

  async function revisar(status) {
    const id     = document.getElementById('rev-id').value;
    const obs    = document.getElementById('rev-obs').value.trim();
    const alertEl = document.getElementById('rev-alert');
    const o      = _ocorrs.find(x => x.id === id);

    if (status === 'aceito' && o) {
      alertEl.innerHTML = alerta('info', '🔄 Verificando conflitos de lançamento…');

      const porMes = diasDaOcorrenciaPorMes(o.data_inicio, o.data_fim);

      // ── 1. Verificar se algum dia do período já possui lançamentos —
      //      dia coberto por ocorrência não pode ter nenhuma outra atividade ──
      for (const { mes, ano, dias } of Object.values(porMes)) {
        let manuais;
        try {
          manuais = await window.db_getManuais(o.fiscal_email, mes, ano);
        } catch(e) {
          alertEl.innerHTML = alerta('danger', 'Erro ao verificar lançamentos: ' + escHtml(e.message));
          return;
        }
        for (const dia of dias) {
          const totalDia = manuais.reduce((acc, m) => {
            if (!m || m.data !== dia) return acc;
            if (m.origem === 'ocorrencia') return acc;
            if (m.status === 'recusado') return acc;
            return acc + (Number(m.pontos) || 0);
          }, 0);
          if (totalDia > 0) {
            alertEl.innerHTML = alerta('danger',
              `⚠️ O dia <strong>${fmtData(dia)}</strong> já possui <strong>${totalDia}</strong> ponto(s) ` +
              `em lançamentos. Dias cobertos por ocorrência não podem ter nenhuma outra atividade lançada. ` +
              `Peça ao fiscal para excluir/ajustar lançamentos desse dia antes de aceitar a ocorrência.`
            );
            return;
          }
        }
      }

      // ── 2. Gerar lançamentos rateando 1000 pts pelos dias úteis do mês ──
      alertEl.innerHTML = alerta('info', '⏳ Gerando lançamentos de ocorrência…');
      try {
        const feriados = await window.carregarFeriadosMunicipais();
        for (const { mes, ano, dias } of Object.values(porMes)) {
          const totalUteis = window.diasUteisNoMes(mes, ano, feriados);
          const taxa = totalUteis > 0 ? Math.round((window.MEDIA_PRODUTIVIDADE_OCORRENCIA / totalUteis) * 100) / 100 : 0;
          for (const dia of dias) {
            if (!window.ehDiaUtil(dia, feriados)) continue;
            await window.db_createManual({
              controle:       `OCR-${ano}-${String(mes).padStart(2,'0')}-${dia.replace(/-/g,'')}`,
              fiscal_email:   o.fiscal_email,
              fiscal_nome:    o.fiscal_nome,
              mes,
              ano,
              data:           dia,
              tipo_id:        99,
              tipo_codigo:    'OCR',
              tipo_nome:      'Ocorrência',
              item_pontuacao: null,
              complexidade:   '—',
              pontos:         taxa,
              pontos_homologado: taxa,
              descricao:      `Ocorrência: ${TIPO_LABELS[o.tipo] || o.tipo} — aceita pelo administrador`,
              obs:            obs || null,
              status:         'homologado',
              origem:         'ocorrencia',
              ocorrencia_id:  id,
              dispositivo_legal: window.dispositivoLegalOcorrencia
                ? window.dispositivoLegalOcorrencia(o.tipo)
                : 'Art. 11 da Lei Complementar nº 548/2023',
            });
          }
        }
      } catch(e) {
        alertEl.innerHTML = alerta('danger', 'Erro ao gerar lançamentos: ' + escHtml(e.message));
        return;
      }
    }

    try {
      await db_updateOcorrencia(id, { status, obs_admin: obs || null });
      document.getElementById('modal-rev').style.display = 'none';
      document.getElementById('alert-area').innerHTML = alerta('ok', `Ocorrência <strong>${status}</strong>.`);
      loadOcorrencias();

      // ── Notificação push ao fiscal (fire-and-forget) ──────
      if (o && status === 'recusado' && typeof window.dispararNotificacaoFiscal === 'function') {
        window.dispararNotificacaoFiscal(
          o.fiscal_email,
          '⚠️ Ocorrência Recusada',
          `Sua ocorrência de ${String(o.mes).padStart(2,'0')}/${o.ano} foi recusada.` +
            (obs ? ` Obs: ${obs}` : '')
        );
      }
    } catch(e) {
      alertEl.innerHTML = alerta('danger', 'Erro: ' + escHtml(e.message));
    }
  }

  function abrirDispositivoOcr(id) {
    const o = _ocorrs.find(x => x.id === id);
    document.getElementById('disp-ocr-texto').value = o?.dispositivo_legal || '—';
    document.getElementById('modal-dispositivo-ocr').style.display = 'flex';
  }
  window.abrirDispositivoOcr = abrirDispositivoOcr;

  window.abrirRev = abrirRev;
  document.getElementById('btn-aceit').addEventListener('click', () => revisar('aceito'));
  document.getElementById('btn-rej').addEventListener('click',   () => revisar('recusado'));
  ['modal-close','modal-close2'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.getElementById('modal-rev').style.display = 'none';
    });
  });
  ['disp-ocr-close','disp-ocr-close2'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.getElementById('modal-dispositivo-ocr').style.display = 'none';
    });
  });

  requireAuth(async user => {
    _user  = user;
    _perfil = user.perfil;
    if (user.perfil !== 'Fiscal' && user.perfil !== 'Administrador') {
      window.location.href = 'dashboard.html'; return;
    }
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('header-nome').textContent = nomeCurto(user.nome||user.email);
    document.getElementById('sidebar').innerHTML = buildSidebar(user.perfil);
    document.getElementById('footer-version').textContent = window.APP_VERSION || '';

    buildSels('sel-mes','sel-ano');
    const _emailParaUm = user.perfil === 'Fiscal' ? user.email : null;
    let _um = new Date().getMonth() + 1, _ua = new Date().getFullYear();
    try { ({ mes: _um, ano: _ua } = await db_getProximaCompetencia(_emailParaUm)); }
    catch (e) { console.warn('[Ocorrencias] Falha ao obter próxima competência:', e); }
    document.getElementById('sel-mes').value = _um;
    document.getElementById('sel-ano').value = _ua;

    if (user.perfil === 'Fiscal') {
      document.getElementById('form-wrap').style.display = '';
      buildSels('o-mes','o-ano');
      document.getElementById('o-mes').value = _um;
      document.getElementById('o-ano').value = _ua;
      document.getElementById('btn-registrar').addEventListener('click', registrarOcorrencia);
    } else {
      // Administrador: show fiscal filter and actions
      document.getElementById('sel-fiscal').style.display = '';
      document.getElementById('th-fiscal-col').style.display = '';
      try {
        const fiscais = await db_getTodosFiscais();
        const selF = document.getElementById('sel-fiscal');
        fiscais.forEach(f => {
          const o = document.createElement('option');
          o.value = f.email||f.id; o.textContent = f.nome||f.id;
          selF.appendChild(o);
        });
      } catch (e) {
        console.warn('[Ocorrencias] Falha ao carregar fiscais:', e);
        document.getElementById('alert-area').innerHTML = alerta('warn', 'Não foi possível carregar a lista de fiscais. Recarregue a página.');
      }

      // Sincroniza automaticamente as férias do VISA (só Administrador) e
      // recarrega a lista quando cria/remove algo, para as novas ocorrências
      // pendentes aparecerem de imediato.
      if (typeof window.verificarESincronizarFerias === 'function') {
        window.verificarESincronizarFerias(user)
          .then(r => { if (r && (r.criadas || r.removidas)) loadOcorrencias(); })
          .catch(() => {});
      }
    }

    attachSortHandlers();
    loadOcorrencias();
    document.getElementById('btn-carregar').addEventListener('click', loadOcorrencias);
    document.getElementById('btn-logout').addEventListener('click', () => {
      firebase.auth().signOut().then(() => { window.location.href = 'index.html'; });
    });
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
  });
</script>
</body>
</html>
