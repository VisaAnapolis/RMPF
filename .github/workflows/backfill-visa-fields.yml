name: Backfill — Campos VISA (os_numero, descricao, motivo_os, documento)

# Corrige os campos os_numero, descricao, motivo_os e documento em TODOS os
# registros da coleção manuais com origem=visa_csv (desde abril/2026).
#
# os_numero: derivado da Modalidade (DE OFICIO → Oficio, PROTOCOLO → Protocolo,
#            DENUNCIA → Denuncia; demais Modalidades → vazio)
# descricao: apenas código e nome do CNAE (sem tipo nem OS)
# motivo_os, documento: preenchidos apenas se vazios
#
# Execute primeiro com dry_run=true para revisar o log antes de gravar.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sem gravar (recomendado na primeira execução)'
        type: boolean
        default: true

jobs:
  backfill:
    name: Backfill campos VISA
    runs-on: ubuntu-latest
    if: github.repository == 'garrado/RMPF'
    permissions: {}   # Não usa GITHUB_TOKEN — apenas FIREBASE_SERVICE_ACCOUNT_JSON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências Python
        run: pip install google-auth --quiet

      - name: Executar backfill
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: "${{ inputs.dry_run }}"
        run: python3 .github/scripts/backfill_visa_fields.py
