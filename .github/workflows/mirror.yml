name: Mirror to Corporate GitHub

on:
  # Espelha LOGO APÓS o deploy do GitHub Pages do garrado concluir.
  #
  # Antes o gatilho era `push: main` — o MESMO evento que dispara o deploy
  # (`pages-build-deployment`), então o mirror rodava em PARALELO com o deploy,
  # e só quando havia um push. Consequência: um deploy sem push (re-run do
  # deploy, rebuild manual do Pages) NÃO disparava o mirror.
  #
  # Encadear por `workflow_run` faz o mirror rodar depois de TODO deploy do
  # branch main — inclusive re-runs e rebuilds manuais —, que é o comportamento
  # de "rodar logo após o deploy".
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-visaanapolis
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror to VisaAnapolis/RMPF
    runs-on: ubuntu-latest
    # Só no repo de origem e só quando o deploy que disparou terminou OK.
    # workflow_dispatch não carrega `workflow_run`, então libera direto.
    if: >-
      github.repository == 'garrado/RMPF' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Clone bare repository
        run: |
          git clone --bare https://github.com/garrado/RMPF.git repo-mirror
      - name: Push mirror to corporate repository
        run: |
          cd repo-mirror
          git push --mirror git@github.com:VisaAnapolis/RMPF.git
      - name: Verify mirror is up-to-date
        run: |
          cd repo-mirror
          LOCAL=$(git rev-parse refs/heads/main)
          REMOTE=$(git ls-remote git@github.com:VisaAnapolis/RMPF.git refs/heads/main | awk '{print $1}')
          echo "Local (garrado):       $LOCAL"
          echo "Remote (VisaAnapolis): $REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::Mirror está fora de sincronia!"
            exit 1
          fi
          echo "✅ Mirror sincronizado."
      - name: Trigger Pages rebuild in VisaAnapolis/RMPF
        run: |
          # Dispara o rebuild do Pages corporativo e FALHA o job se não for
          # aceito. Antes o passo só emitia ::warning:: e nunca falhava, o que
          # escondia uma quebra do deploy corporativo (ex.: MIRROR_PAT expirado)
          # atrás de um check verde. Tenta até 4 vezes com backoff para tolerar
          # instabilidade transitória da API.
          max=4
          attempt=1
          while [ "$attempt" -le "$max" ]; do
            STATUS=$(curl -s -o /tmp/pages_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.MIRROR_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/VisaAnapolis/RMPF/pages/builds)
            echo "Tentativa $attempt/$max — Pages rebuild status: $STATUS"
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "200" ]; then
              echo "✅ Pages rebuild disparado com sucesso."
              exit 0
            fi
            echo "Resposta da API: $(cat /tmp/pages_resp.json)"
            attempt=$((attempt + 1))
            [ "$attempt" -le "$max" ] && sleep $(( (attempt - 1) * 5 ))
          done
          echo "::error::Pages rebuild do site corporativo falhou após $max tentativas (último HTTP $STATUS)."
          exit 1
