name: Mirror to Corporate GitHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-visaanapolis
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror to VisaAnapolis/RMPF
    runs-on: ubuntu-latest
    if: github.repository == 'garrado/RMPF'

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Clone bare repository
        run: |
          git clone --bare https://github.com/garrado/RMPF.git repo-mirror
      - name: Push mirror to corporate repository
        run: |
          cd repo-mirror
          git push --mirror git@github.com:VisaAnapolis/RMPF.git
      - name: Verify mirror is up-to-date
        run: |
          cd repo-mirror
          LOCAL=$(git rev-parse refs/heads/main)
          REMOTE=$(git ls-remote git@github.com:VisaAnapolis/RMPF.git refs/heads/main | awk '{print $1}')
          echo "Local (garrado):       $LOCAL"
          echo "Remote (VisaAnapolis): $REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::Mirror está fora de sincronia!"
            exit 1
          fi
          echo "✅ Mirror sincronizado."
      - name: Garantir deploy do Pages corporativo
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          SHA=$(cd repo-mirror && git rev-parse refs/heads/main)
          API="https://api.github.com/repos/VisaAnapolis/RMPF"

          gh_api() {
            curl -s \
              -H "Authorization: Bearer $MIRROR_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # Estado consolidado dos builds do Pages para o commit espelhado:
          # success (algum deploy publicou), pending (ainda rodando ou nenhum
          # apareceu) ou failed (todos terminaram sem sucesso).
          state() {
            gh_api "$API/actions/runs?head_sha=$SHA&per_page=100" \
              | jq -r '[.workflow_runs[]? | select(.path == "dynamic/pages/pages-build-deployment")]
                       | if any(.[]; .conclusion == "success") then "success"
                         elif any(.[]; .status != "completed") or length == 0 then "pending"
                         else "failed" end'
          }

          for TENTATIVA in 1 2 3; do
            echo "Tentativa $TENTATIVA/3: aguardando deploy do Pages corporativo para $SHA..."
            for _ in $(seq 1 36); do
              S=$(state || echo pending)
              if [ "$S" = "success" ]; then
                echo "✅ Site corporativo publicado com o commit espelhado."
                exit 0
              fi
              if [ "$S" = "failed" ]; then
                break
              fi
              sleep 10
            done
            if [ "$TENTATIVA" -lt 3 ]; then
              echo "Deploy não concluiu com sucesso; solicitando novo build do Pages corporativo..."
              HTTP=$(gh_api -o /dev/null -w "%{http_code}" -X POST "$API/pages/builds")
              echo "Pedido de rebuild: HTTP $HTTP"
              sleep 15
            fi
          done
          echo "::error::Deploy do Pages corporativo não concluiu com sucesso após 3 tentativas. O site https://visaanapolis.github.io/RMPF/ pode estar desatualizado — veja https://github.com/VisaAnapolis/RMPF/actions"
          exit 1
