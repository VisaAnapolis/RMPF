name: Resumo Semanal de Pontos (FCM Push)

# Toda segunda-feira às 7h UTC (4h de Brasília) envia um push a cada fiscal
# informando a quantidade de pontos homologados acumulados até o momento.
on:
  schedule:
    - cron: '0 7 * * 1'   # Segunda-feira, 07:00 UTC (04:00 BRT horário padrão / 05:00 BRST horário de verão)
  workflow_dispatch:        # Permite disparo manual para testes

jobs:
  weekly-summary:
    name: Enviar resumo semanal via FCM
    runs-on: ubuntu-latest
    if: github.repository == 'garrado/RMPF'
    permissions: {}   # Este job não usa o GITHUB_TOKEN — apenas FIREBASE_SERVICE_ACCOUNT_JSON

    steps:
      - name: Consultar Firestore e enviar pushes via FCM HTTP v1
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth --quiet
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          import google.oauth2.service_account
          import google.auth.transport.requests

          PROJECT_ID   = 'visam-3a30b'
          FIRESTORE_URL = f'https://firestore.googleapis.com/v1/projects/{PROJECT_ID}/databases/(default)/documents'
          FCM_URL       = f'https://fcm.googleapis.com/v1/projects/{PROJECT_ID}/messages:send'

          # ── Autenticação OAuth2 (Firestore + FCM) ──────────────────
          sa_info = json.loads(os.environ['FIREBASE_SA_JSON'])
          creds = google.oauth2.service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=[
                  'https://www.googleapis.com/auth/datastore',
                  'https://www.googleapis.com/auth/firebase.messaging',
              ],
          )
          creds.refresh(google.auth.transport.requests.Request())
          headers = {
              'Authorization': 'Bearer ' + creds.token,
              'Content-Type': 'application/json',
          }

          def firestore_query(collection, filters):
              """runQuery estruturada no Firestore."""
              url = f'{FIRESTORE_URL}:runQuery'
              body = json.dumps({
                  'structuredQuery': {
                      'from': [{'collectionId': collection}],
                      'where': {
                          'compositeFilter': {
                              'op': 'AND',
                              'filters': filters,
                          }
                      },
                  }
              }).encode()
              req = urllib.request.Request(url, data=body, method='POST', headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def field_value(doc, field):
              """Extrai valor de um campo de um documento Firestore."""
              fields = doc.get('document', {}).get('fields', {})
              fv = fields.get(field, {})
              for t in ('integerValue', 'doubleValue', 'stringValue', 'booleanValue'):
                  if t in fv:
                      return fv[t]
              return None

          def field_array(item, field):
              """Extrai valores string de um campo array de um documento Firestore."""
              fields = item.get('document', {}).get('fields', {})
              fv = fields.get(field, {})
              arr = fv.get('arrayValue', {}).get('values', [])
              return [v.get('stringValue', '') for v in arr if v.get('stringValue', '').strip()]

          # ── 1. Buscar todos os manuais com status 'aceito' ─────────
          print('Consultando pontos homologados…')
          results = firestore_query('manuais', [
              {'fieldFilter': {
                  'field': {'fieldPath': 'status'},
                  'op': 'EQUAL',
                  'value': {'stringValue': 'aceito'},
              }},
          ])

          # Agrupa pontos por fiscal
          pontos_por_fiscal = {}
          for item in results:
              doc = item.get('document')
              if not doc:
                  continue
              email = field_value(item, 'fiscal_email')
              pts   = field_value(item, 'pontos_homologado')
              if not email:
                  continue
              try:
                  pts = float(pts or 0)
              except (TypeError, ValueError):
                  pts = 0.0
              pontos_por_fiscal[email] = pontos_por_fiscal.get(email, 0.0) + pts

          total_geral = sum(pontos_por_fiscal.values())
          print(f'Total geral de pontos homologados: {total_geral:.0f}')
          print(f'Fiscais com pontos: {list(pontos_por_fiscal.keys())}')

          # ── 2. Buscar todos os usuários e extrair tokens FCM ─────
          # Lê apenas fcmTokens (array), que é o campo exclusivo do RMPF.
          # Não lê fcm_token (campo do VISA) para evitar disparar notificações
          # no service worker do VISA.
          print('Buscando usuários com token FCM…')
          url_q = f'{FIRESTORE_URL}:runQuery'
          body_q = json.dumps({
              'structuredQuery': {
                  'from': [{'collectionId': 'usuarios'}],
              }
          }).encode()
          req_q = urllib.request.Request(url_q, data=body_q, method='POST', headers=headers)
          with urllib.request.urlopen(req_q) as r:
              usuarios_results = json.loads(r.read())

          fiscais = []
          for item in usuarios_results:
              doc = item.get('document')
              if not doc:
                  continue
              email    = field_value(item, 'email') or doc.get('name', '').split('/')[-1]
              grupo    = field_value(item, 'grupo') or ''
              tokens   = field_array(item, 'fcmTokens')
              doc_name = doc.get('name', '')
              if not tokens:
                  continue
              # Envia a todos que não são Administrador (inclui Fiscal e usuários sem grupo)
              if grupo != 'Administrador':
                  for t in tokens:
                      fiscais.append({'email': email, 'fcm_token': t, 'doc_name': doc_name})

          print(f'Usuários com token FCM: {len(fiscais)}')

          if not fiscais:
              print('Nenhum usuário com token FCM registrado. Encerrando.')
              sys.exit(0)

          # ── 3. Enviar push personalizado a cada fiscal ─────────────
          def send_fcm(fcm_token, titulo, corpo):
              payload = json.dumps({
                  'message': {
                      'token': fcm_token,
                      'notification': {'title': titulo, 'body': corpo},
                      'webpush': {
                          'fcm_options': {
                              'link': 'https://visaanapolis.github.io/RMPF/meus-lancamentos.html',
                          },
                      },
                  },
              }).encode()
              req = urllib.request.Request(FCM_URL, data=payload, method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      return True, r.read().decode()
              except urllib.error.HTTPError as e:
                  return False, e.read().decode()

          def is_unregistered(resp_str):
              """Retorna True se o erro FCM indicar token não registrado."""
              try:
                  err = json.loads(resp_str)
                  for detail in err.get('error', {}).get('details', []):
                      if detail.get('errorCode') == 'UNREGISTERED':
                          return True
              except Exception:
                  pass
              return False

          def remove_fcm_token(doc_name, token):
              """Remove um token FCM inválido do array fcmTokens no Firestore."""
              commit_url = f'{FIRESTORE_URL}:commit'
              body = json.dumps({
                  'writes': [{
                      'transform': {
                          'document': doc_name,
                          'fieldTransforms': [{
                              'fieldPath': 'fcmTokens',
                              'removeAllFromArray': {
                                  'values': [{'stringValue': token}]
                              }
                          }]
                      }
                  }]
              }).encode()
              req = urllib.request.Request(commit_url, data=body, method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      r.read()
                      return True
              except urllib.error.HTTPError as e:
                  print(f"  ⚠️  Falha ao remover token de {doc_name}: {e.read().decode()}", file=sys.stderr)
                  return False

          erros = 0
          for f in fiscais:
              pts = pontos_por_fiscal.get(f['email'], 0.0)
              titulo = '📊 Resumo Semanal RMPF'
              corpo  = (
                  f"Você tem {pts:.0f} pontos homologados até o momento. "
                  f"Total geral da equipe: {total_geral:.0f} pts."
              )
              ok, resp = send_fcm(f['fcm_token'], titulo, corpo)
              if ok:
                  print(f"  ✅ Push enviado para {f['email']}")
              else:
                  print(f"  ❌ Falha para {f['email']}: {resp}", file=sys.stderr)
                  erros += 1
                  if is_unregistered(resp):
                      remove_fcm_token(f['doc_name'], f['fcm_token'])
                      print(f"  🗑️  Token inválido removido para {f['email']}")

          if erros:
              print(f'::warning::{erros} notificação(ões) não entregue(s).')
          else:
              print(f'✅ Resumo semanal enviado para {len(fiscais)} fiscal(is).')
          EOF
