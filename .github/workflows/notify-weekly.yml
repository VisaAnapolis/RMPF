name: Resumo Semanal de Pontos (FCM Push)

# Toda segunda-feira às 7h UTC (4h de Brasília) envia um push a cada fiscal
# informando a quantidade de pontos homologados acumulados até o momento.
on:
  schedule:
    - cron: '0 7 * * 1'   # Segunda-feira, 07:00 UTC (04:00 BRT horário padrão / 05:00 BRST horário de verão)
  workflow_dispatch:        # Permite disparo manual para testes

jobs:
  weekly-summary:
    name: Enviar resumo semanal via FCM
    runs-on: ubuntu-latest
    if: github.repository == 'garrado/RMPF'
    permissions: {}   # Este job não usa o GITHUB_TOKEN — apenas FIREBASE_SERVICE_ACCOUNT_JSON

    steps:
      - name: Consultar Firestore e enviar pushes via FCM HTTP v1
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth --quiet
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          import google.oauth2.service_account
          import google.auth.transport.requests

          PROJECT_ID   = 'visam-3a30b'
          FIRESTORE_URL = f'https://firestore.googleapis.com/v1/projects/{PROJECT_ID}/databases/(default)/documents'
          FCM_URL       = f'https://fcm.googleapis.com/v1/projects/{PROJECT_ID}/messages:send'

          # ── Autenticação OAuth2 (Firestore + FCM) ──────────────────
          sa_info = json.loads(os.environ['FIREBASE_SA_JSON'])
          creds = google.oauth2.service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=[
                  'https://www.googleapis.com/auth/datastore',
                  'https://www.googleapis.com/auth/firebase.messaging',
              ],
          )
          creds.refresh(google.auth.transport.requests.Request())
          headers = {
              'Authorization': 'Bearer ' + creds.token,
              'Content-Type': 'application/json',
          }

          def firestore_query(collection, filters):
              """runQuery estruturada no Firestore."""
              url = f'{FIRESTORE_URL}:runQuery'
              body = json.dumps({
                  'structuredQuery': {
                      'from': [{'collectionId': collection}],
                      'where': {
                          'compositeFilter': {
                              'op': 'AND',
                              'filters': filters,
                          }
                      },
                  }
              }).encode()
              req = urllib.request.Request(url, data=body, method='POST', headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def field_value(doc, field):
              """Extrai valor de um campo de um documento Firestore."""
              fields = doc.get('document', {}).get('fields', {})
              fv = fields.get(field, {})
              for t in ('integerValue', 'doubleValue', 'stringValue', 'booleanValue', 'timestampValue'):
                  if t in fv:
                      return fv[t]
              return None

          def field_array(item, field):
              """Extrai valores string de um campo array de um documento Firestore."""
              fields = item.get('document', {}).get('fields', {})
              fv = fields.get(field, {})
              arr = fv.get('arrayValue', {}).get('values', [])
              return [v.get('stringValue', '') for v in arr if v.get('stringValue', '').strip()]

          def resolver_competencia():
              """Competência aberta (mes/ano) — a MESMA base do dashboard.

              O dashboard apura por competência (mes/ano), não por data. Lê
              app_config/competencia_aberta; se ausente, usa o mês corrente (BRT).
              """
              tz = timezone(timedelta(hours=-3))
              hoje = datetime.now(tz)
              mes, ano = hoje.month, hoje.year
              try:
                  url = f'{FIRESTORE_URL}/app_config/competencia_aberta'
                  req = urllib.request.Request(url, method='GET', headers=headers)
                  with urllib.request.urlopen(req) as r:
                      doc = json.loads(r.read())
                  f = doc.get('fields', {})
                  if 'mes' in f and 'integerValue' in f['mes']:
                      mes = int(f['mes']['integerValue'])
                  if 'ano' in f and 'integerValue' in f['ano']:
                      ano = int(f['ano']['integerValue'])
              except Exception as exc:
                  print(f'  ⚠️  Falha ao ler competência aberta, usando mês corrente: {exc}')
              return mes, ano

          # ── 1. Buscar manuais da competência aberta e filtrar status ──
          MES, ANO = resolver_competencia()
          print(f'Competência de referência: {MES:02d}/{ANO}')
          print('Consultando pontos da competência…')
          results = firestore_query('manuais', [
              {'fieldFilter': {'field': {'fieldPath': 'mes'}, 'op': 'EQUAL',
                               'value': {'integerValue': str(MES)}}},
              {'fieldFilter': {'field': {'fieldPath': 'ano'}, 'op': 'EQUAL',
                               'value': {'integerValue': str(ANO)}}},
          ])

          VALID_STATUSES = ('aceito', 'fechado', 'homologado')

          # Agrupa pontos por fiscal
          pontos_por_fiscal = {}
          for item in results:
              doc = item.get('document')
              if not doc:
                  continue
              status = field_value(item, 'status') or ''
              if status not in VALID_STATUSES:
                  continue
              email    = field_value(item, 'fiscal_email')
              pts_hom  = field_value(item, 'pontos_homologado')
              pts_raw  = field_value(item, 'pontos')
              pts      = pts_hom if pts_hom is not None else pts_raw
              if not email:
                  continue
              try:
                  pts = float(pts or 0)
              except (TypeError, ValueError):
                  pts = 0.0
              pontos_por_fiscal[email] = pontos_por_fiscal.get(email, 0.0) + pts

          total_geral = sum(pontos_por_fiscal.values())
          print(f'Total geral de pontos homologados: {total_geral:.0f}')
          print(f'Fiscais com pontos: {list(pontos_por_fiscal.keys())}')

          # ── 2. Buscar todos os usuários e extrair tokens FCM ─────
          # Lê apenas rmpf_fcmTokens (campo EXCLUSIVO do RMPF).
          # Tokens legados fcmTokens e fcm_token NÃO são usados: ambos estão
          # vinculados ao service worker do VISA e fariam a notificação abrir
          # o app VISA. Usuários sem rmpf_fcmTokens precisam fazer login
          # novamente no RMPF para registrar o token correto.
          print('Buscando usuários com token FCM…')
          url_q = f'{FIRESTORE_URL}:runQuery'
          body_q = json.dumps({
              'structuredQuery': {
                  'from': [{'collectionId': 'usuarios'}],
              }
          }).encode()
          req_q = urllib.request.Request(url_q, data=body_q, method='POST', headers=headers)
          with urllib.request.urlopen(req_q) as r:
              usuarios_results = json.loads(r.read())

          fiscais = []
          for item in usuarios_results:
              doc = item.get('document')
              if not doc:
                  continue
              email    = field_value(item, 'email') or doc.get('name', '').split('/')[-1]
              grupo    = field_value(item, 'grupo') or ''
              tokens   = field_array(item, 'rmpf_fcmTokens')
              doc_name = doc.get('name', '')
              if not tokens:
                  continue
              # Envia a todos que não são Administrador (inclui Fiscal e usuários sem grupo)
              if grupo != 'Administrador':
                  for t in tokens:
                      fiscais.append({'email': email, 'fcm_token': t, 'doc_name': doc_name, 'campo': 'rmpf_fcmTokens'})

          print(f'Usuários com token FCM: {len(fiscais)}')

          # ── Diagnóstico de registro de token (por que rmpf_fcmTokens está vazio) ──
          # O app grava em cada usuário, a cada execução do initFCM, o motivo da
          # falha em rmpf_notifDiag. Aqui agregamos esses motivos sobre TODA a
          # base — é o que diz, com dado real, por que ninguém registrou token.
          from collections import Counter
          diag_counter   = Counter()
          perm_counter   = Counter()
          ver_counter    = Counter()
          fiscais_pontos = set(pontos_por_fiscal.keys())
          diag_dos_com_pontos = {}
          for item in usuarios_results:
              doc = item.get('document')
              if not doc:
                  continue
              email = field_value(item, 'email') or doc.get('name', '').split('/')[-1]
              diag  = field_value(item, 'rmpf_notifDiag')      or '(sem rmpf_notifDiag)'
              perm  = field_value(item, 'rmpf_notifPermissao') or '(sem rmpf_notifPermissao)'
              ver   = field_value(item, 'rmpf_appVersion')     or '(sem rmpf_appVersion)'
              acesso = field_value(item, 'rmpf_ultimoAcesso')  or '(sem rmpf_ultimoAcesso)'
              diag_counter[diag] += 1
              perm_counter[perm] += 1
              ver_counter[ver]   += 1
              if email in fiscais_pontos:
                  diag_dos_com_pontos[email] = (diag, perm, ver, acesso)

          print('── Diagnóstico rmpf_notifDiag (toda a base) ──')
          for k, v in diag_counter.most_common():
              print(f'   {v:>3}×  {k}')
          print('── rmpf_notifPermissao ──')
          for k, v in perm_counter.most_common():
              print(f'   {v:>3}×  {k}')
          print('── rmpf_appVersion ──')
          for k, v in ver_counter.most_common():
              print(f'   {v:>3}×  {k}')
          print('── Fiscais COM pontos: versão x ÚLTIMO ACESSO (decide cache-trap vs não-abriu) ──')
          for email in sorted(fiscais_pontos):
              d = diag_dos_com_pontos.get(email)
              if d:
                  print(f'   {email}: ver={d[2]} | ultimoAcesso={d[3]} | diag={d[0]} | perm={d[1]}')
              else:
                  print(f'   {email}: (sem documento em usuarios ou sem campos rmpf_)')

          if not fiscais:
              print('::error::Nenhum usuário com rmpf_fcmTokens registrado — '
                    'nenhum push foi enviado, apesar de existirem fiscais com pontos. '
                    'Verifique se o app RMPF está gravando rmpf_fcmTokens '
                    '(VAPID key em app_config/vapid_key e registro do token no login). '
                    'Veja o diagnóstico rmpf_notifDiag acima para a causa por usuário.',
                    file=sys.stderr)
              sys.exit(1)

          # ── 3. Enviar push personalizado a cada fiscal ─────────────
          def send_fcm(fcm_token, titulo, corpo, link):
              payload = json.dumps({
                  'message': {
                      'token': fcm_token,
                      'data': {'title': titulo, 'body': corpo, 'link': link},
                  },
              }).encode()
              req = urllib.request.Request(FCM_URL, data=payload, method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      return True, r.read().decode()
              except urllib.error.HTTPError as e:
                  return False, e.read().decode()

          def is_unregistered(resp_str):
              """Retorna True se o erro FCM indicar token não registrado."""
              try:
                  err = json.loads(resp_str)
                  for detail in err.get('error', {}).get('details', []):
                      if detail.get('errorCode') == 'UNREGISTERED':
                          return True
              except Exception:
                  pass
              return False

          def remove_fcm_token(doc_name, token, campo):
              """Remove um token FCM inválido do array indicado no Firestore."""
              commit_url = f'{FIRESTORE_URL}:commit'
              body = json.dumps({
                  'writes': [{
                      'transform': {
                          'document': doc_name,
                          'fieldTransforms': [{
                              'fieldPath': campo,
                              'removeAllFromArray': {
                                  'values': [{'stringValue': token}]
                              }
                          }]
                      }
                  }]
              }).encode()
              req = urllib.request.Request(commit_url, data=body, method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      r.read()
                      return True
              except urllib.error.HTTPError as e:
                  print(f"  ⚠️  Falha ao remover token de {doc_name}: {e.read().decode()}", file=sys.stderr)
                  return False

          erros = 0
          for f in fiscais:
              pts = pontos_por_fiscal.get(f['email'], 0.0)
              titulo = '📊 Resumo Semanal RMPF'
              corpo  = (
                  f"Competência {MES:02d}/{ANO}: você tem {pts:.0f} pontos válidos. "
                  f"Total da equipe: {total_geral:.0f} pts."
              )
              ok, resp = send_fcm(
                  f['fcm_token'], titulo, corpo,
                  'https://visaanapolis.github.io/RMPF/dashboard.html',
              )
              if ok:
                  print(f"  ✅ Push enviado para {f['email']}")
              else:
                  print(f"  ❌ Falha para {f['email']}: {resp}", file=sys.stderr)
                  erros += 1
                  if is_unregistered(resp):
                      remove_fcm_token(f['doc_name'], f['fcm_token'], f['campo'])
                      print(f"  🗑️  Token inválido removido para {f['email']}")

          if erros and erros == len(fiscais):
              print(f'::error::Nenhuma notificação entregue ({erros}/{len(fiscais)}). '
                    f'Push falhou para todos os tokens registrados.', file=sys.stderr)
              sys.exit(1)
          elif erros:
              print(f'::warning::{erros} notificação(ões) não entregue(s).')
          else:
              print(f'✅ Resumo semanal enviado para {len(fiscais)} fiscal(is).')
          EOF
