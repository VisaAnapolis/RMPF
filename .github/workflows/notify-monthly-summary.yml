name: Resumo Mensal de Pontos (FCM Push)

# Envia notificações push mensais:
#   - Fiscais: total de pontos homologados no mês corrente
#   - Administradores: quantidade de fiscais com menos de 1000 pontos homologados (total acumulado)
#
# Execução agendada desativada: o disparo é manual, pela aba Actions do GitHub
# ou pelo botão no admin.html.
on:
  workflow_dispatch:        # Permite disparo manual via interface do GitHub
  repository_dispatch:
    types: [monthly-push-summary]   # Disparado pelo botão no admin.html

jobs:
  monthly-summary:
    name: Enviar resumo mensal via FCM
    runs-on: ubuntu-latest
    if: github.repository == 'garrado/RMPF'
    permissions: {}   # Este job não usa o GITHUB_TOKEN — apenas FIREBASE_SERVICE_ACCOUNT_JSON

    steps:
      - name: Consultar Firestore e enviar pushes via FCM HTTP v1
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth --quiet
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          import google.oauth2.service_account
          import google.auth.transport.requests

          PROJECT_ID    = 'visam-3a30b'
          FIRESTORE_URL = f'https://firestore.googleapis.com/v1/projects/{PROJECT_ID}/databases/(default)/documents'
          FCM_URL       = f'https://fcm.googleapis.com/v1/projects/{PROJECT_ID}/messages:send'

          # ── Autenticação OAuth2 (Firestore + FCM) ──────────────────────
          sa_info = json.loads(os.environ['FIREBASE_SA_JSON'])
          creds = google.oauth2.service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=[
                  'https://www.googleapis.com/auth/datastore',
                  'https://www.googleapis.com/auth/firebase.messaging',
              ],
          )
          creds.refresh(google.auth.transport.requests.Request())
          headers = {
              'Authorization': 'Bearer ' + creds.token,
              'Content-Type': 'application/json',
          }

          # ── Competência aberta (mesma base do dashboard) ───────────────
          def resolver_competencia():
              """Competência aberta (mes/ano) — a MESMA base do dashboard.

              Lê app_config/competencia_aberta; se ausente, usa o mês corrente
              em horário de Brasília.
              """
              tz = timezone(timedelta(hours=-3))
              hoje = datetime.now(tz)
              mes, ano = hoje.month, hoje.year
              try:
                  url = f'{FIRESTORE_URL}/app_config/competencia_aberta'
                  req = urllib.request.Request(url, method='GET', headers=headers)
                  with urllib.request.urlopen(req) as r:
                      doc = json.loads(r.read())
                  f = doc.get('fields', {})
                  if 'mes' in f and 'integerValue' in f['mes']:
                      mes = int(f['mes']['integerValue'])
                  if 'ano' in f and 'integerValue' in f['ano']:
                      ano = int(f['ano']['integerValue'])
              except Exception as exc:
                  print(f'  ⚠️  Falha ao ler competência aberta, usando mês corrente: {exc}')
              return mes, ano

          MES, ANO = resolver_competencia()
          print(f'Competência de referência: {MES:02d}/{ANO}')

          def firestore_query(collection, filters):
              """runQuery estruturada no Firestore."""
              url = f'{FIRESTORE_URL}:runQuery'
              body = json.dumps({
                  'structuredQuery': {
                      'from': [{'collectionId': collection}],
                      'where': {
                          'compositeFilter': {
                              'op': 'AND',
                              'filters': filters,
                          }
                      },
                  }
              }).encode()
              req = urllib.request.Request(url, data=body, method='POST', headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def field_value(item, field):
              """Extrai valor de um campo de um documento Firestore."""
              fields = item.get('document', {}).get('fields', {})
              fv = fields.get(field, {})
              for t in ('integerValue', 'doubleValue', 'stringValue', 'booleanValue'):
                  if t in fv:
                      return fv[t]
              return None

          def field_array(item, field):
              """Extrai valores string de um campo array de um documento Firestore."""
              fields = item.get('document', {}).get('fields', {})
              fv = fields.get(field, {})
              arr = fv.get('arrayValue', {}).get('values', [])
              return [v.get('stringValue', '') for v in arr if v.get('stringValue', '').strip()]

          def send_fcm(fcm_token, titulo, corpo, link):
              payload = json.dumps({
                  'message': {
                      'token': fcm_token,
                      'data': {'title': titulo, 'body': corpo, 'link': link},
                  },
              }).encode()
              req = urllib.request.Request(FCM_URL, data=payload, method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      return True, r.read().decode()
              except urllib.error.HTTPError as e:
                  return False, e.read().decode()

          def is_unregistered(resp_str):
              """Retorna True se o erro FCM indicar token não registrado."""
              try:
                  err = json.loads(resp_str)
                  for detail in err.get('error', {}).get('details', []):
                      if detail.get('errorCode') == 'UNREGISTERED':
                          return True
              except Exception:
                  pass
              return False

          def remove_fcm_token(doc_name, token, campo):
              """Remove um token FCM inválido do array indicado no Firestore."""
              commit_url = f'{FIRESTORE_URL}:commit'
              body = json.dumps({
                  'writes': [{
                      'transform': {
                          'document': doc_name,
                          'fieldTransforms': [{
                              'fieldPath': campo,
                              'removeAllFromArray': {
                                  'values': [{'stringValue': token}]
                              }
                          }]
                      }
                  }]
              }).encode()
              req = urllib.request.Request(commit_url, data=body, method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      r.read()
                      return True
              except urllib.error.HTTPError as e:
                  print(f"  ⚠️  Falha ao remover token de {doc_name}: {e.read().decode()}", file=sys.stderr)
                  return False

          # ═════════════════════════════════════════════════════════════
          # PARTE 1 — Pontos dos fiscais no mês corrente
          # ═════════════════════════════════════════════════════════════
          print('Consultando pontos do mês corrente…')
          manuais_mes = firestore_query('manuais', [
              {'fieldFilter': {
                  'field': {'fieldPath': 'mes'},
                  'op': 'EQUAL',
                  'value': {'integerValue': str(MES)},
              }},
              {'fieldFilter': {
                  'field': {'fieldPath': 'ano'},
                  'op': 'EQUAL',
                  'value': {'integerValue': str(ANO)},
              }},
          ])

          VALID_STATUSES = ('aceito', 'fechado', 'homologado')
          pontos_mes_por_fiscal = {}
          for item in manuais_mes:
              if not item.get('document'):
                  continue
              status = field_value(item, 'status') or ''
              if status not in VALID_STATUSES:
                  continue
              email = field_value(item, 'fiscal_email')
              if not email:
                  continue
              pts_hom = field_value(item, 'pontos_homologado')
              pts_raw = field_value(item, 'pontos')
              pts = pts_hom if pts_hom is not None else pts_raw
              try:
                  pts = float(pts or 0)
              except (TypeError, ValueError):
                  pts = 0.0
              pontos_mes_por_fiscal[email] = pontos_mes_por_fiscal.get(email, 0.0) + pts

          print(f'Fiscais com pontos no mês {MES}/{ANO}: {len(pontos_mes_por_fiscal)}')

          # ═════════════════════════════════════════════════════════════
          # PARTE 2 — Pontos acumulados totais (para calcular < 1000)
          # ═════════════════════════════════════════════════════════════
          print('Consultando pontos homologados totais…')
          url_all = f'{FIRESTORE_URL}:runQuery'
          body_all = json.dumps({
              'structuredQuery': {
                  'from': [{'collectionId': 'manuais'}],
              }
          }).encode()
          req_all = urllib.request.Request(url_all, data=body_all, method='POST', headers=headers)
          with urllib.request.urlopen(req_all) as r:
              manuais_todos = json.loads(r.read())

          pontos_total_por_fiscal = {}
          for item in manuais_todos:
              if not item.get('document'):
                  continue
              status = field_value(item, 'status') or ''
              if status not in VALID_STATUSES:
                  continue
              email = field_value(item, 'fiscal_email')
              if not email:
                  continue
              pts_hom = field_value(item, 'pontos_homologado')
              pts_raw = field_value(item, 'pontos')
              pts = pts_hom if pts_hom is not None else pts_raw
              try:
                  pts = float(pts or 0)
              except (TypeError, ValueError):
                  pts = 0.0
              pontos_total_por_fiscal[email] = pontos_total_por_fiscal.get(email, 0.0) + pts

          fiscais_abaixo_1000 = sum(1 for p in pontos_total_por_fiscal.values() if p < 1000)
          print(f'Fiscais com menos de 1000 pts homologados (total): {fiscais_abaixo_1000}')

          # ═════════════════════════════════════════════════════════════
          # PARTE 3 — Buscar usuários com tokens FCM (Fiscal e Administrador)
          # Lê apenas rmpf_fcmTokens (campo EXCLUSIVO do RMPF).
          # Tokens legados fcmTokens e fcm_token NÃO são usados: ambos estão
          # vinculados ao service worker do VISA e fariam a notificação abrir
          # o app VISA. Usuários sem rmpf_fcmTokens precisam fazer login
          # novamente no RMPF para registrar o token correto.
          # ═════════════════════════════════════════════════════════════
          print('Buscando usuários com token FCM…')
          url_q = f'{FIRESTORE_URL}:runQuery'
          body_q = json.dumps({
              'structuredQuery': {
                  'from': [{'collectionId': 'usuarios'}],
              }
          }).encode()
          req_q = urllib.request.Request(url_q, data=body_q, method='POST', headers=headers)
          with urllib.request.urlopen(req_q) as r:
              todos_results = json.loads(r.read())

          fiscais = []
          admins  = []
          for item in todos_results:
              doc = item.get('document')
              if not doc:
                  continue
              email    = field_value(item, 'email') or doc.get('name', '').split('/')[-1]
              grupo    = field_value(item, 'grupo') or ''
              tokens   = field_array(item, 'rmpf_fcmTokens')
              doc_name = doc.get('name', '')
              if not tokens:
                  continue
              if grupo == 'Administrador':
                  for t in tokens:
                      admins.append({'email': email, 'fcm_token': t, 'doc_name': doc_name, 'campo': 'rmpf_fcmTokens'})
              else:
                  for t in tokens:
                      fiscais.append({'email': email, 'fcm_token': t, 'doc_name': doc_name, 'campo': 'rmpf_fcmTokens'})

          print(f'Fiscais com token FCM: {len(fiscais)}')
          print(f'Administradores com token FCM: {len(admins)}')

          # ═════════════════════════════════════════════════════════════
          # PARTE 4 — Enviar pushes
          # ═════════════════════════════════════════════════════════════
          erros = 0

          # — Push para cada fiscal —
          for f in fiscais:
              pts = pontos_mes_por_fiscal.get(f['email'], 0.0)
              titulo = '📊 Pontuação Mensal RMPF'
              corpo  = f"Sua pontuação homologada em {MES:02d}/{ANO} é de {pts:.0f} ponto(s)."
              ok, resp = send_fcm(
                  f['fcm_token'], titulo, corpo,
                  'https://visaanapolis.github.io/RMPF/dashboard.html',
              )
              if ok:
                  print(f"  ✅ Push enviado para fiscal {f['email']}")
              else:
                  print(f"  ❌ Falha para fiscal {f['email']}: {resp}", file=sys.stderr)
                  erros += 1
                  if is_unregistered(resp):
                      remove_fcm_token(f['doc_name'], f['fcm_token'], f['campo'])
                      print(f"  🗑️  Token inválido removido para {f['email']}")

          # — Push para cada administrador —
          for a in admins:
              titulo = '📋 Resumo de Fiscais — RMPF'
              corpo  = (
                  f"{fiscais_abaixo_1000} fiscal(is) com menos de 1.000 pontos homologados "
                  f"(referência: {MES:02d}/{ANO})."
              )
              ok, resp = send_fcm(
                  a['fcm_token'], titulo, corpo,
                  'https://visaanapolis.github.io/RMPF/dashboard.html',
              )
              if ok:
                  print(f"  ✅ Push enviado para admin {a['email']}")
              else:
                  print(f"  ❌ Falha para admin {a['email']}: {resp}", file=sys.stderr)
                  erros += 1
                  if is_unregistered(resp):
                      remove_fcm_token(a['doc_name'], a['fcm_token'], a['campo'])
                      print(f"  🗑️  Token inválido removido para {a['email']}")

          # ── Resumo final ───────────────────────────────────────────────
          total_destinatarios = len(fiscais) + len(admins)
          if not total_destinatarios:
              print('::error::Nenhum usuário com rmpf_fcmTokens registrado — '
                    'nenhum push foi enviado. Verifique a VAPID key '
                    '(app_config/vapid_key) e o registro do token no app RMPF.',
                    file=sys.stderr)
              sys.exit(1)

          if erros == total_destinatarios:
              print(f'::error::Nenhuma notificação entregue ({erros}/{total_destinatarios}). '
                    f'Push falhou para todos os tokens registrados.', file=sys.stderr)
              sys.exit(1)

          if erros:
              print(f'::warning::{erros} notificação(ões) não entregue(s).')
          else:
              print(f'✅ Notificações enviadas: {len(fiscais)} fiscal(is), {len(admins)} administrador(es).')
          EOF
