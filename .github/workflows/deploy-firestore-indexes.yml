name: Criar / Atualizar Índices do Firestore

# Cria (ou verifica) todos os índices compostos definidos em firestore.indexes.json.
# Disparado pelo botão "Criar Índices" no admin.html ou manualmente via GitHub Actions.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-firestore-indexes]

jobs:
  deploy-indexes:
    name: Deploy Firestore Indexes
    runs-on: ubuntu-latest
    if: github.repository == 'garrado/RMPF'
    permissions: {}   # Apenas FIREBASE_SERVICE_ACCOUNT_JSON é necessário

    steps:
      - name: Checkout (para ler firestore.indexes.json)
        uses: actions/checkout@v4

      - name: Criar índices via Firestore Management API
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth --quiet
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error, time
          import google.oauth2.service_account
          import google.auth.transport.requests

          PROJECT_ID = 'visam-3a30b'
          BASE_URL   = f'https://firestore.googleapis.com/v1/projects/{PROJECT_ID}/databases/(default)'

          # ── Autenticação ──────────────────────────────────────────────
          sa_info = json.loads(os.environ['FIREBASE_SA_JSON'])
          creds = google.oauth2.service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=['https://www.googleapis.com/auth/datastore'],
          )
          creds.refresh(google.auth.transport.requests.Request())

          def auth_headers():
              if not creds.valid:
                  creds.refresh(google.auth.transport.requests.Request())
              return {
                  'Authorization': 'Bearer ' + creds.token,
                  'Content-Type': 'application/json',
              }

          def api_get(url):
              req = urllib.request.Request(url, headers=auth_headers())
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def api_post(url, body):
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=auth_headers(), method='POST')
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()), None
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode()
                  return None, f'HTTP {e.code}: {err_body}'

          # ── Ler indexes desejados do firestore.indexes.json ──────────
          with open('firestore.indexes.json') as f:
              config = json.load(f)

          desired = config.get('indexes', [])
          print(f'Índices desejados: {len(desired)}')

          # ── Listar índices existentes (para evitar duplicatas) ────────
          existing_sigs = set()
          try:
              page_token = None
              while True:
                  url = f'{BASE_URL}/collectionGroups/-/indexes'
                  if page_token:
                      url += f'?pageToken={page_token}'
                  resp = api_get(url)
                  for idx in resp.get('indexes', []):
                      cg    = idx.get('name', '').split('/collectionGroups/')[-1].split('/')[0]
                      scope = idx.get('queryScope', '')
                      fields = tuple(
                          (f.get('fieldPath',''), f.get('order',''), f.get('arrayConfig',''))
                          for f in idx.get('fields', [])
                          if not f.get('fieldPath','').startswith('__')
                      )
                      existing_sigs.add((cg, scope, fields))
                  page_token = resp.get('nextPageToken')
                  if not page_token:
                      break
              print(f'Índices existentes no projeto: {len(existing_sigs)}')
          except Exception as e:
              print(f'Aviso: não foi possível listar índices existentes ({e}). Tentando criar todos.')

          # ── Criar os índices ausentes ──────────────────────────────────
          created = 0
          skipped = 0
          errors  = 0

          for idx in desired:
              cg     = idx['collectionGroup']
              scope  = idx.get('queryScope', 'COLLECTION')
              fields = idx.get('fields', [])

              sig_fields = tuple(
                  (f.get('fieldPath',''), f.get('order',''), f.get('arrayConfig',''))
                  for f in fields
                  if not f.get('fieldPath','').startswith('__')
              )
              sig = (cg, scope, sig_fields)

              if sig in existing_sigs:
                  print(f'  [SKIP]  {cg} {[f["fieldPath"] for f in fields]} — já existe')
                  skipped += 1
                  continue

              body = {
                  'queryScope': scope,
                  'fields': [
                      {k: v for k, v in f.items() if v}
                      for f in fields
                  ],
              }
              url = f'{BASE_URL}/collectionGroups/{cg}/indexes'
              result, err = api_post(url, body)
              if err:
                  print(f'  [ERRO]  {cg} {[f["fieldPath"] for f in fields]}: {err}')
                  errors += 1
              else:
                  op_name = result.get('name', '')
                  print(f'  [OK]    {cg} {[f["fieldPath"] for f in fields]} — operação: {op_name}')
                  created += 1

          print()
          print(f'Resultado: {created} criado(s), {skipped} já existia(m), {errors} erro(s).')
          if errors:
              sys.exit(1)
          EOF
