name: Notificar Fiscal (FCM Push)

# Disparado pelo cliente JS (js/notifications.js) via repository_dispatch
# quando um lançamento ou ocorrência é recusado/sobrescrito.
on:
  repository_dispatch:
    types: [notify-fiscal]

jobs:
  send-push:
    name: Enviar push ao fiscal via FCM
    runs-on: ubuntu-latest
    if: github.repository == 'garrado/RMPF'

    steps:
      - name: Enviar notificação via FCM HTTP v1
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FCM_TOKEN:        ${{ github.event.client_payload.fcm_token }}
          TITULO:           ${{ github.event.client_payload.titulo }}
          CORPO:            ${{ github.event.client_payload.corpo }}
        run: |
          pip install google-auth --quiet
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          import google.oauth2.service_account
          import google.auth.transport.requests

          # ── Autenticação OAuth2 com a Service Account do Firebase ──
          sa_info = json.loads(os.environ['FIREBASE_SA_JSON'])
          creds = google.oauth2.service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=['https://www.googleapis.com/auth/firebase.messaging'],
          )
          creds.refresh(google.auth.transport.requests.Request())

          # ── Payload FCM ────────────────────────────────────────────
          payload = json.dumps({
              'message': {
                  'token': os.environ['FCM_TOKEN'],
                  'notification': {
                      'title': os.environ['TITULO'],
                      'body':  os.environ['CORPO'],
                  },
                  'webpush': {
                      'fcm_options': {
                          'link': 'https://visaanapolis.github.io/RMPF/meus-lancamentos.html',
                      },
                  },
              },
          }).encode()

          # ── Envio via FCM HTTP v1 ──────────────────────────────────
          url = 'https://fcm.googleapis.com/v1/projects/visam-3a30b/messages:send'
          req = urllib.request.Request(url, data=payload, method='POST')
          req.add_header('Authorization', 'Bearer ' + creds.token)
          req.add_header('Content-Type', 'application/json')

          try:
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode()
                  print(f'✅ Notificação enviada com sucesso: {body}')
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f'::error::FCM retornou HTTP {e.code}: {body}', file=sys.stderr)
              sys.exit(1)
          EOF
